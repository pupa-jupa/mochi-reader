[package]
name = "mochi-reader"
version = "2.0.0"
description = "A local desktop reader for books and manga"
authors = ["Mochi Reader contributors"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "mochi_reader_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
ammonia = "4.1.2"
base64 = "0.22.1"
chardetng = "1.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
encoding_rs = "0.8.35"
fb2 = "0.4.4"
infer = "0.22.0"
pulldown-cmark = "0.13.0"
quick-xml = { version = "0.39.2", features = ["serialize"] }
reqwest = { version = "0.13.4", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono", "uuid", "functions"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-log = "2.9.0"
tauri-plugin-opener = "2.5.4"
tauri-plugin-window-state = "2.4.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
url = { version = "2.5.8", features = ["serde"] }
walkdir = "2.5.0"
zip = { version = "8.4.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
