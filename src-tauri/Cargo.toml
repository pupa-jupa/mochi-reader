[package]
name = "mochi-reader"
version = "0.1.0"
description = "A cozy local reader for books and manga"
authors = ["Mochi Reader contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "mochi_reader_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono", "uuid", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-log = "2.9.0"
tauri-plugin-opener = "2.5.4"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
